[package]
name = "chat-de-choco-tto"
version = "0.1.0"
description = "A Tauri game project for chat-de-choco-tto"
authors = ["kyorohiro"]
edition = "2021"

[lib]
name = "chat_de_choco_tto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
